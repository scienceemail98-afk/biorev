<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biology Quiz Game — 24 MCQs</title><style>body{margin:0;font-family:system-ui,Arial;background:linear-gradient(135deg,#e5f8ed,#e7f0ff);color:#153b31}.wrap{max-width:760px;margin:30px auto;padding:18px}.panel{background:white;border-radius:22px;box-shadow:0 12px 35px #174c3b25;padding:28px}h1{margin:0;color:#167746}.sub{color:#58736a}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.track{height:12px;background:#e6edea;border-radius:12px;margin:20px 0;overflow:hidden}.fill{height:100%;background:#25a966;width:0;transition:.3s}.question{font-size:1.4rem;font-weight:750;margin:22px 0}.choices{display:grid;gap:12px}.choice{font:inherit;text-align:left;border:2px solid #d7e8df;border-radius:14px;background:#f9fdfb;padding:15px;cursor:pointer}.choice:hover:not(:disabled){border-color:#31a975}.choice.correct{background:#d9f9e5;border-color:#1a9a55}.choice.wrong{background:#ffe4e4;border-color:#e35a5a}.choice:disabled{cursor:default}.feedback{min-height:42px;margin:15px 0;font-weight:600}.btn{border:0;border-radius:13px;padding:14px 22px;background:#147f4d;color:white;font-weight:750;cursor:pointer;font-size:1rem}.btn:disabled{opacity:.4;cursor:default}.small{font-size:.9rem;color:#547065}.hide{display:none}.center{text-align:center}.score{font-size:3.5rem;color:#16864f;font-weight:800}.footer{margin-top:20px;text-align:center;font-size:.8rem;color:#678177}@media(max-width:600px){.wrap{margin:8px auto;padding:8px}.panel{padding:20px}.question{font-size:1.15rem}}</style></head><body><main class="wrap"><section class="panel" id="intro"><div class="center"><div style="font-size:4rem">🌿🧬🐇</div><h1>Biology Challenge!</h1><p class="sub">Population Dynamics • Human Population • Biodiversity</p><p>24 multiple-choice questions · 4 options each · Instant feedback</p><input id="name" placeholder="Student name (optional)" style="padding:13px;border:1px solid #b9d7c6;border-radius:10px;font:inherit;max-width:90%"><p><button class="btn" onclick="start()">Start Quiz ▶</button></p></div></section><section class="panel hide" id="game"><div class="top"><strong id="counter"></strong><span id="points"></span></div><div class="track"><div class="fill" id="progress"></div></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="btn" id="next" onclick="advance()" disabled>Next question →</button></section><section class="panel hide center" id="end"><div style="font-size:4rem">🏆</div><h1>Quiz complete!</h1><p id="greeting"></p><div class="score" id="finalScore"></div><p id="remark"></p><button class="btn" onclick="restart()">Play Again ↻</button><button class="btn" onclick="print()" style="background:#39678b;margin:6px">Print Result</button></section><div class="footer">Based on the uploaded Biology Revision worksheet · 24 MCQs</div></main><script>
const data=[
['Population density is the number of organisms per:', ['Unit area','Species','Year','Ecosystem'],0,'Density describes how many organisms occupy a given area.'],
['Which is a density-independent limiting factor?',['Competition','Disease','Fire','Predation'],2,'Fire can affect a population regardless of its density.'],
['Movement of individuals into a population is called:',['Emigration','Immigration','Extinction','Dispersal'],1,'Immigration means individuals enter a population.'],
['Population growth that slows as resources become limited is:',['Logistic growth','Exponential growth','Immigration','Natality'],0,'Logistic growth levels off near carrying capacity.'],
['Which reproductive pattern involves few offspring and greater parental care?',['r-strategy','K-strategy','Emigration','Dispersion'],1,'K-strategists typically invest more care in fewer offspring.'],
['The study of human populations is called:',['Demography','Genetics','Taxonomy','Physiology'],0,'Demography studies human populations.'],
['Zero population growth occurs when:',['Births + immigration = deaths + emigration','Births are always zero','Immigration exceeds emigration','Deaths are always zero'],0,'Population gains must equal population losses.'],
['Different inherited fur colors in a litter of rabbits illustrate:',['Ecosystem diversity','Genetic diversity','Population density','Species diversity'],1,'Inherited variation within a species is genetic diversity.'],
['The variety of ecosystems in the biosphere is:',['Genetic diversity','Species diversity','Ecosystem diversity','Dispersion'],2,'Ecosystem diversity describes different habitat and ecosystem types.'],
['Which is an indirect economic value of biodiversity?',['Food','Clothing','Medicine','Oxygen production'],3,'Oxygen production is an ecosystem service.'],
['How is population density calculated?',['Number of organisms ÷ area occupied','Area occupied ÷ number of organisms','Births ÷ deaths','Immigration − emigration'],0,'Population density equals the number of organisms divided by area.'],
['Competition and disease are examples of:',['Density-independent factors','Density-dependent factors','Ecosystem diversity','Demographic transition'],1,'Their effects can become stronger as population density rises.'],
['Demographic transition describes a change from:',['Low births and deaths to high births and deaths','High births and deaths to low births and deaths','High immigration to zero immigration','Low population density to high density only'],1,'Demographic transition involves declining birth and death rates.'],
['Which groups are included in age structure?',['Only reproductive individuals','Only young and elderly individuals','Pre-reproductive, reproductive, and post-reproductive','Only individuals who immigrate'],2,'Age structure separates a population into life-stage groups.'],
['Which statement best describes human dependence on biodiversity?',['Humans rely only on animals','Humans rely only on plants','Humans rely on neither plants nor animals','Humans rely on both plants and animals'],3,'Both plants and animals provide food, medicine, and other resources.'],
['The pattern of spacing of individuals within an area is called:',['Carrying capacity','Dispersion','Demography','Emigration'],1,'Dispersion describes how individuals are spaced.'],
['The maximum number of individuals an environment can support long-term is:',['Population density','Birth rate','Carrying capacity','Immigration'],2,'Carrying capacity is the sustainable population limit.'],
['Individuals moving away from a population is:',['Emigration','Immigration','Natality','Logistic growth'],0,'Emigration means leaving a population.'],
['The number of species and their relative abundance in a community describes:',['Genetic diversity','Species diversity','Population density','Age structure'],1,'Species diversity considers variety and relative abundance.'],
['Which field studies human population size, distribution, movement, births, and deaths?',['Taxonomy','Ecology only','Genetics','Demography'],3,'Demography analyzes human population characteristics and changes.'],
['120 rabbits live in an area of 30 km². What is their population density?',['30 rabbits/km²','90 rabbits/km²','4 rabbits/km²','150 rabbits/km²'],2,'120 ÷ 30 = 4 rabbits per square kilometer.'],
['Which pair correctly compares density-dependent and density-independent factors?',['Competition is dependent; fire is independent','Fire is dependent; competition is independent','Both competition and fire are dependent','Both competition and fire are independent'],0,'Competition depends on population density; fire generally does not.'],
['How can agriculture and medicine increase human carrying capacity?',['By reducing food and increasing deaths','By increasing food supply and reducing disease and deaths','By preventing all immigration','By eliminating the need for resources'],1,'More food and improved health can support more people.'],
['Which examples correctly match the three levels of biodiversity?',['Genetic: forests and lakes; species: fur colors; ecosystem: trees and birds','Genetic: trees and birds; species: forests and lakes; ecosystem: fur colors','Genetic: fur colors; species: trees and birds; ecosystem: forests and lakes','Genetic: number per km²; species: birth rate; ecosystem: emigration'],2,'Inherited fur differences show genetic diversity; species variety and ecosystem variety describe the other levels.']
];
let index=0,score=0,answered=false,student='';const $=id=>document.getElementById(id);function start(){student=$('name').value.trim();$('intro').classList.add('hide');$('game').classList.remove('hide');render()}function render(){answered=false;const q=data[index];$('counter').textContent=`Question ${index+1} of ${data.length}`;$('points').textContent=`⭐ ${score} points`;$('progress').style.width=`${index/data.length*100}%`;$('question').textContent=q[0];$('feedback').textContent='';$('next').disabled=true;$('next').textContent=index===data.length-1?'See results →':'Next question →';$('choices').innerHTML='';q[1].forEach((label,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=`${'ABCD'[i]}. ${label}`;b.onclick=()=>choose(i);$('choices').appendChild(b)})}function choose(i){if(answered)return;answered=true;let q=data[index];if(i===q[2])score++;[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(j===q[2])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});$('feedback').textContent=(i===q[2]?'✅ Correct! ':'❌ Not quite. ')+q[3];$('points').textContent=`⭐ ${score} points`;$('next').disabled=false}function advance(){index++;if(index>=data.length){$('game').classList.add('hide');$('end').classList.remove('hide');$('greeting').textContent=student?`Well done, ${student}!`:'Well done!';$('finalScore').textContent=`${score} / ${data.length}`;$('remark').textContent=score>=21?'Excellent work! 🌟':score>=16?'Great effort! Keep learning!': 'Keep practicing and try again!';return}render()}function restart(){index=0;score=0;$('end').classList.add('hide');$('intro').classList.remove('hide')}
</script></body></html>
